{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <link rel="stylesheet"
          href="{% static 'signup.css' %}">
</head>

<body>

<div class="signup-container">

    <h1>Create Account</h1>

    <p class="subtitle">
        Join the Book Library
    </p>

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>
        <input type="text"
               name="username"
               required>

        <label>Email</label>
        <input type="email"
               name="email"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               required>

        <label>Confirm Password</label>
        <input type="password"
               name="confirm_password"
               required>

        <button type="submit">
            Sign Up
        </button>

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <p class="login-link">
        Already have an account?
        <a href="{% url 'login' %}">Login</a>
    </p>

</div>

</body>
</html>
